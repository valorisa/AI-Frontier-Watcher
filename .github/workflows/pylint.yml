name: pylint

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/pylint.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/pylint.yml"

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install pylint
        run: python -m pip install pylint

      - name: Run pylint
        run: pylint --recursive=y scripts
