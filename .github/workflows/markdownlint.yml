name: Markdownlint

on:
  push:
    paths:
      - "**.md"
      - ".markdownlint.json"
      - ".github/workflows/markdownlint.yml"
  pull_request:
    paths:
      - "**.md"
      - ".markdownlint.json"
      - ".github/workflows/markdownlint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !reports/*.md
